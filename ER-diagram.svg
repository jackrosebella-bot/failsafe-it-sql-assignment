<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FailSafe IT ER-diagram</title>
  <desc id="desc">Tre tabeller: Customers, Assignments och Consultants. Customers och Consultants har varsin en-till-många-relation till Assignments.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .card { fill: #ffffff; stroke: #9aa9bd; stroke-width: 2; }
      .head { fill: #17365d; }
      .title { fill: #ffffff; font: 700 22px 'Segoe UI', Arial, sans-serif; }
      .field { fill: #1b2735; font: 16px 'Segoe UI', Arial, sans-serif; }
      .key { fill: #0b5cad; font-weight: 700; }
      .note { fill: #3d4c5f; font: 15px 'Segoe UI', Arial, sans-serif; }
      .line { stroke: #52677f; stroke-width: 3; fill: none; }
      .rel { fill: #17365d; font: 700 15px 'Segoe UI', Arial, sans-serif; }
      .label { fill: #f5f7fb; stroke: #c7d2df; stroke-width: 1; rx: 8; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text x="600" y="55" text-anchor="middle" fill="#17365d" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">FailSafe IT – ER-diagram</text>
  <text x="600" y="84" text-anchor="middle" class="note">Ett uppdrag tillhör exakt en kund och exakt en konsult</text>

  <!-- Relationships are drawn behind the entity cards. -->
  <path class="line" d="M 350 350 L 450 350"/>
  <path class="line" d="M 780 350 L 850 350"/>
  <text x="365" y="333" class="rel">1</text>
  <text x="428" y="333" class="rel">M</text>
  <text x="792" y="333" class="rel">M</text>
  <text x="832" y="333" class="rel">1</text>

  <rect x="55" y="170" width="295" height="350" rx="12" class="card"/>
  <path d="M67 170 H338 Q350 170 350 182 V222 H55 V182 Q55 170 67 170Z" class="head"/>
  <text x="78" y="204" class="title">Customers</text>
  <text x="78" y="262" class="field"><tspan class="key">PK</tspan><tspan>  CustomerId</tspan></text>
  <text x="78" y="304" class="field">OrganizationNumber</text>
  <text x="78" y="346" class="field">CompanyName</text>
  <text x="78" y="388" class="field">Email</text>
  <text x="78" y="430" class="field">Phone</text>
  <text x="78" y="488" class="note">En kund kan ha flera uppdrag</text>

  <rect x="450" y="125" width="330" height="440" rx="12" class="card"/>
  <path d="M462 125 H768 Q780 125 780 137 V177 H450 V137 Q450 125 462 125Z" class="head"/>
  <text x="474" y="159" class="title">Assignments</text>
  <text x="474" y="218" class="field"><tspan class="key">PK</tspan><tspan>  AssignmentId</tspan></text>
  <text x="474" y="260" class="field"><tspan class="key">FK</tspan><tspan>  CustomerId</tspan></text>
  <text x="474" y="302" class="field"><tspan class="key">FK</tspan><tspan>  ConsultantId</tspan></text>
  <text x="474" y="344" class="field">StartDate</text>
  <text x="474" y="386" class="field">EndDate</text>
  <text x="474" y="428" class="field">RoleDescription</text>
  <line x1="474" y1="456" x2="756" y2="456" stroke="#d4dde8" stroke-width="1"/>
  <text x="474" y="489" class="note">Kopplingstabell / uppdrag</text>
  <text x="474" y="516" class="note">En rad = en kund + en konsult</text>

  <rect x="850" y="170" width="295" height="350" rx="12" class="card"/>
  <path d="M862 170 H1133 Q1145 170 1145 182 V222 H850 V182 Q850 170 862 170Z" class="head"/>
  <text x="873" y="204" class="title">Consultants</text>
  <text x="873" y="262" class="field"><tspan class="key">PK</tspan><tspan>  ConsultantId</tspan></text>
  <text x="873" y="304" class="field">PersonalNumber</text>
  <text x="873" y="346" class="field">FullName</text>
  <text x="873" y="388" class="field">HourlyRate</text>
  <text x="873" y="430" class="field">Specialty</text>
  <text x="873" y="488" class="note">En konsult kan ha flera uppdrag</text>

  <rect x="55" y="610" width="1090" height="48" rx="10" fill="#e6edf6" stroke="#c7d2df"/>
  <text x="78" y="640" class="note"><tspan font-weight="700">Relationer:</tspan> Customers 1:M Assignments  •  Consultants 1:M Assignments  •  Customer–Consultant M:N löses via Assignments</text>
</svg>
